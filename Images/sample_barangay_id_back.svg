<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="Sample Barangay ID, back side">
  <defs>
    <linearGradient id="org" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f39a3d"/><stop offset="1" stop-color="#e07b1a"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="card"><rect width="856" height="540" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="856" height="540" fill="url(#org)"/>
    <path d="M0 40 C 200 90, 420 0, 620 60 S 820 60, 856 30 L 856 500 C 660 450, 480 540, 280 480 S 60 520, 0 470 Z" fill="#fff"/>
    <path d="M0 40 C 200 90, 420 0, 620 60 S 820 60, 856 30" fill="none" stroke="#5cc04a" stroke-width="10"/>
    <path d="M856 500 C 660 450, 480 540, 280 480 S 60 520, 0 470" fill="none" stroke="#5cc04a" stroke-width="10"/>
  </g>

  <!-- Thumbmark: generic na guhit lang, hindi totoong fingerprint -->
  <g transform="translate(60 80)">
    <rect width="190" height="210" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <g filter="url(#soft)" fill="none" stroke="#3b82f6" stroke-width="5" opacity="0.75">
      <ellipse cx="95" cy="108" rx="62" ry="80"/>
      <ellipse cx="95" cy="108" rx="48" ry="64"/>
      <ellipse cx="95" cy="108" rx="34" ry="48"/>
      <ellipse cx="95" cy="108" rx="20" ry="32"/>
      <ellipse cx="95" cy="108" rx="8" ry="16"/>
    </g>
    <text x="95" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">RIGHT THUMBMARK</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">
    <g font-family="'Courier New', monospace" font-size="24" fill="#334155">
      <text x="420" y="104">01-01-1990</text>
      <text x="680" y="104">CALOOCAN CITY</text>
      <text x="350" y="176">SINGLE</text>
      <text x="520" y="176">5'5"</text>
      <text x="640" y="176">60 kg</text>
      <text x="760" y="176">—</text>
    </g>
    <line x1="300" y1="114" x2="540" y2="114" stroke="#1f2937" stroke-width="2"/>
    <line x1="570" y1="114" x2="800" y2="114" stroke="#1f2937" stroke-width="2"/>
    <text x="420" y="136">DATE OF BIRTH</text>
    <text x="685" y="136">PLACE OF BIRTH</text>
    <line x1="290" y1="186" x2="800" y2="186" stroke="#1f2937" stroke-width="2"/>
    <text x="350" y="208">CIVIL STATUS</text>
    <text x="520" y="208">HEIGHT</text>
    <text x="640" y="208">WEIGHT</text>
    <text x="760" y="208">RELIGION</text>
    <line x1="300" y1="250" x2="530" y2="250" stroke="#1f2937" stroke-width="2"/>
    <line x1="570" y1="250" x2="800" y2="250" stroke="#1f2937" stroke-width="2"/>
    <text x="415" y="272">TIN ID NO.</text>
    <text x="685" y="272">VOTER'S ID NO.</text>
    <text x="428" y="316" font-size="17">IN CASE OF EMERGENCY PLEASE NOTIFY:</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">
    <text x="60" y="360">NAME:</text>
    <text x="60" y="398">ADDRESS:</text>
    <text x="60" y="436">TEL./CELL NO.:</text>
    <text x="60" y="474">VALID UNTIL: YEAR</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="#334155">
    <text x="200" y="358">MARIA P. DELA CRUZ</text>
    <text x="200" y="396">123 SAMPLE ST., CALOOCAN</text>
    <text x="200" y="434">0900-000-0000</text>
    <text x="230" y="472">12-31-2030</text>
  </g>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="120" y1="366" x2="800" y2="366"/>
    <line x1="140" y1="404" x2="800" y2="404"/>
    <line x1="180" y1="442" x2="800" y2="442"/>
    <line x1="216" y1="480" x2="420" y2="480"/>
  </g>

  <g transform="rotate(-18 428 300)" opacity="0.22">
    <text x="428" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="150" font-weight="900" fill="#b91c1c" letter-spacing="8">SAMPLE</text>
  </g>
</svg>
